# LLM Gateway — example config.
# Copy to config.yaml and edit. config.yaml is gitignored.

# Port (used by the systemd unit; uvicorn is launched separately, see llm-gateway.service)
port: 4000

# Master/admin API key. Clients send it as `Authorization: Bearer <key>`; it also
# unlocks the /ui console (sign in with an admin key). Empty/missing = bootstrap-open
# (any caller accepted) UNTIL you add a user. Per-user keys with allow-lists + quotas
# are managed in the /ui Users tab (stored encrypted in store.db), not here.
api_key: "sk-change-me"

# How often (seconds) each backend's /v1/models is polled for liveness + model discovery.
health_check_interval: 30

# Per-request log lines (→ attempt, ← result with backend + status + duration).
# Set to false if you're using the stats DB and want a quieter log.
log_per_call: true

# Expose models in /v1/models prefixed with their backend name, e.g.
# `together/moonshotai/Kimi-K2.5-fp4` or `openrouter/nvidia/nemotron-3-ultra-…`.
# This makes the provider visible when the same model id exists on several
# backends. The prefix is stripped again before forwarding. Both forms are
# always accepted on input — a prefixed id routes to exactly that backend, a
# bare id/alias still routes by priority. Set false for legacy bare listing.
model_prefix: true

# Max in-flight requests per backend before it's treated as "busy" and skipped
# in priority routing — the request spills to the next backend in the list
# instead of queueing/overloading a slow one. Missing/0 = unlimited (default).
# This global value applies to every backend that doesn't set its own
# `max_concurrent` (see below). Busy backends are flagged on the routing tab.
# max_concurrent: 1

# Call parking (default): when EVERY backend that maps an alias is busy, the call
# is held in a FIFO queue until one frees, instead of returning 503. No client
# field is needed — a standard request just waits, then gets a 200 (or a 503 +
# Retry-After if the wait runs out). All tunable live in the /ui Server tab too.
# park_timeout_s: 60      # global default seconds a call may wait for a free backend
# max_parked: 100         # queue cap; a busy call beyond this gets 503
# Per-alias override (blank/absent = the global default above; 0 = parking off for
# that alias). Also editable per chat alias in the /ui Mapping editor (`park_s`).
# alias_park:
#   fast: 10              # this alias waits at most 10s
#   bulk: 0               # never parks — 503 immediately when busy
#
# Async LLM requests use the official OpenAI Responses background mode (no custom
# field): POST /v1/responses {background:true} -> queued id -> poll GET
# /v1/responses/{id} -> cancel POST /v1/responses/{id}/cancel. The background
# worker parks in the same queue, up to:
# async_park_timeout_s: 600
# A parked generation job whose backends briefly ALL go unhealthy (e.g. a busy
# ComfyUI dropping its discovery poll mid-render) rides out the flap for this long
# before it's declared "no healthy backend"; a genuinely-offline alias still fails
# after it (not the full park deadline).
# park_health_grace_s: 90

# Optional call-stats sink: SQLite DB; the dashboard is built into the /ui console
# (Statistic tab) — no separate server/port anymore. When enabled, every call is
# recorded with backend, source (the authenticated user, else X-Source header / client
# IP), alias, model, tokens, status, duration, and USD cost (for backends that expose
# pricing in /v1/models — Together.ai does; local backends → 0).
# Toggle takes effect on full restart; not picked up by hot-reload.
# NOTE: optional — the Server tab in /ui manages these (stored, overriding config).
stats:
  enabled: false
  db_path: stats.db
  retention_days: 0   # 0 = keep forever; otherwise prune older rows hourly

# Backends, in priority order (1 = preferred).
#   enabled: false  → fully out of rotation (no health-check, no routing)
#   api_key         → sent as `Authorization: Bearer <key>` to this backend
#                     (use for cloud APIs like together.ai, OpenAI, OpenRouter, …)
#   max_concurrent  → per-backend in-flight cap; overrides the global one above.
#                     Match it to the backend's real parallelism — e.g. 1 for a
#                     llama.cpp server run with `--parallel 1`, high/unset for a
#                     cloud API that handles concurrency itself.
#   local           → ALSO list this backend's models bare (without the
#                     `<backend>/` prefix), alongside the prefixed id. A bare
#                     request then routes by priority across every `local` backend
#                     that serves it — same failover as a virtual alias. Does not
#                     affect model_prefix; the prefixed id stays listed too.
backends:
  - name: local-gpu
    url: http://192.168.1.10:8080      # e.g. llama-swap, llama.cpp server, vLLM, …
    priority: 1
    max_concurrent: 1                   # single-slot llama.cpp → 1 request at a time

  - name: local-cpu
    url: http://192.168.1.11:8080
    priority: 2
    max_concurrent: 1
    # enabled: false                    # set to take this backend out of rotation

  # - name: together                    # Cloud fallback (OpenAI-compatible)
  #   url: https://api.together.xyz
  #   priority: 99
  #   api_key: "tgp_v1_…"               # https://api.together.xyz/settings/api-keys
  #   chat_only: true                   # skip image/video/embedding models
  #   serverless_only: true             # skip dedicated-endpoint-only models

  # - name: openrouter                  # Cloud fallback (OpenAI-compatible)
  #   url: https://openrouter.ai/api    # NOTE: /api only — the gateway appends /v1/…
  #   priority: 98
  #   api_key: "sk-or-v1-…"             # https://openrouter.ai/settings/keys
  #   chat_only: true                   # drop image/audio-output-only models
  #   serverless_only: false            # keep :free models; true = paid-only
  #                                     # (paid models need account credits, else HTTP 402)

# Virtual models — pseudo model names that map to real model IDs on backends.
#   string  → same model on every backend
#   dict    → per-backend mapping; backend keys without an entry are skipped.
#             A backend's value is either:
#               "model-id"                       → just the model name
#               {model: "model-id", priority: N} → model name + a priority that
#                                                   overrides the backend's global
#                                                   priority *for this alias only*
#
# Routing: when a request comes in for `model: "fast"`, the gateway walks backends in
# priority order and picks the first one that (a) is healthy and (b) exposes the
# mapped model. The remaining backends become fallback if the chosen one errors.
# A per-alias `priority` reorders that walk for this alias; backends without an
# override keep their global priority (same numeric scale as the backends list).
virtual_models:
  "translator":  "Aya-Expanse-8B"        # same model on every backend
  "caption":     "llama-joycaption-beta-one"
  "vision":
    local-gpu:   "Qwen3-VL-8B"
    # local-cpu has no vision model → skipped for this alias
  "fast":
    local-gpu:   "Qwen3.5-9B"
    local-cpu:   "gemma-3-9b-it"
    # together:  "meta-llama/Meta-Llama-3.1-8B-Instruct-Turbo"
  # Per-alias priority override: prefer the CPU box for 'cheap', even though
  # local-gpu has the higher global priority (1 vs 2) in the backends list.
  "cheap":
    local-cpu:
      model:     "gemma-3-9b-it"
      priority:  1
    local-gpu:
      model:     "Qwen3.5-9B"
      priority:  2

# ── Generation (image / video / TTS) — Phase 1 ────────────────────────────────
# A ComfyUI backend speaks a different protocol than OpenAI, so it declares
# `type: comfyui`. Discovery uses /object_info (not /v1/models); dispatch submits
# a parametrized workflow and polls /history. Optional per-backend knobs:
#   poll_interval     → seconds between /history polls (default 1.0)
#   max_wait          → max seconds to wait for a result (default 600)
#   read_timeout      → per-HTTP-request read timeout (default 60); a hung /history
#                       or /view read fails fast → failover, not a max_wait stall
#   disconnect_grace  → seconds of continuous unreachability tolerated mid-run before
#                       failing over to the next candidate (default 30)
# (Backends still take `priority`, `enabled`, `max_concurrent` like any other.)
#
#   - name: ct452-comfy
#     type: comfyui
#     url: http://192.168.1.20:8188
#     priority: 1
#     max_concurrent: 1               # one generation at a time on this GPU
#     poll_interval: 1.0
#     max_wait: 600

# Generation aliases: the `model` field of a POST /v1/generations request. Each
# maps to an ORDERED list of candidates (first healthy + not-busy one is used;
# cross-candidate failover + VRAM coordination come in later phases). A candidate
# names the backend, the task, the workflow file (API-format JSON), and optionally
# a model/checkpoint to inject into the workflow's loader node.
# `mapping` binds logical params to concrete workflow nodes+fields, e.g.
# "prompt → node 6, field text". This is convention-FREE: it works with any
# workflow regardless of how its nodes are named. Omit `mapping` to let the
# gateway auto-detect via naming heuristics (fine for templated workflows; the
# explicit form always wins). Later a "register workflow" UI will author these.
# image_models:
#   "flux":
#     - backend:  ct452-comfy
#       task:     text2img
#       workflow: /srv/workflows/text2img_workflow_flux1_api.json
#       model:    flux1-dev-Q8_0.gguf        # optional — injected via the mapping
#       mapping:
#         prompt:          {node: "6",  field: "text"}
#         negative_prompt: {node: "7",  field: "text"}
#         width:           {node: "5",  field: "width"}
#         height:          {node: "5",  field: "height"}
#         steps:           {node: "3",  field: "steps"}
#         cfg:             {node: "3",  field: "cfg"}
#         seed:            {node: "3",  field: "seed"}
#         model:           {node: "4",  field: "unet_name"}
#   "sdxl":
#     - backend:  ct452-comfy                # no `mapping` → auto-detected
#       task:     text2img
#       workflow: /srv/workflows/text2img_workflow_sd15_api.json

# Job store for generations: SQLite metadata + on-disk artifacts, retrievable by
# id (GET /v1/jobs/{id} + /result/{n}) until TTL. Auto-on when image_models are
# set. Sync requests also get their result inline; the cached copy stays until TTL.
# Optional in config — the Server tab in /ui manages these too (stored override).
# jobs:
#   db_path: jobs.db
#   blob_dir: jobs               # artifact files live under jobs/<id>/<n>.<ext>
#   default_ttl_s: 86400         # how long a result stays retrievable (24h)
#   prune_interval_s: 3600       # how often expired jobs are swept
#   store_path: store.db         # writable generation-alias store (UI source of truth)

# Management console: a server-rendered UI mounted at /ui on the main port. Manage
# backends, chat + generation aliases, workflow mappings, users, and server settings;
# run a chat/image playground; watch jobs, stats, and the live routing map. Auto-on
# whenever the store is (image_models set, or jobs.enabled: true, or any user exists).
# The store (store.db) is seeded once from this config, then becomes the source of
# truth — so you can run mostly from config OR mostly from the console.
#
# AUTH: the console is gated by an admin session once the gateway is "locked" (a
# master api_key above OR at least one user in the Users tab). With neither, it's
# bootstrap-open. Per-user keys carry an allow-list (chat/image aliases, model ids,
# or whole backends — which also filters what each key sees in /v1/models) and an
# optional monthly cost quota. Keep the console on a trusted network regardless.
